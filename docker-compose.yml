services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_saas}
      POSTGRES_USER: ${POSTGRES_USER:-agent_saas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_saas_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_saas} -d ${POSTGRES_DB:-agent_saas}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass atlas-redis-dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "atlas-redis-dev", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "minio", "--version"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 3s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      i=0;
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        i=$$((i+1));
        if [ $$i -gt 30 ]; then echo 'minio not ready' >&2; exit 1; fi;
        sleep 1;
      done;
      mc mb --ignore-existing local/atlas-documents
      "

  # Open-source IdP (replaces Clerk). Admin UI: http://localhost:8080
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/atlas-realm.json:/opt/keycloak/data/import/atlas-realm.json:ro
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  sandbox-python:
    build:
      context: ./services/sandbox-python
    image: atlas-sandbox-python:local
    profiles: ["build-sandbox"]

  sandbox-manager:
    build:
      context: ./services/sandbox-manager
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-atlas-redis-dev}@redis:6379/0
      SANDBOX_INTERNAL_TOKEN: ${SANDBOX_INTERNAL_TOKEN:-dev-sandbox-internal-token-change-me}
      SANDBOX_ALLOWED_PROXY_PREFIXES: http://backend:7777/
      DOCKER_BIN: docker
      SANDBOX_PYTHON_IMAGE: atlas-sandbox-python:local
      SANDBOX_MAX_CONCURRENT: "8"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Internal-only — do not publish 8090 to the host.
    expose:
      - "8090"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 8

  backend:
    build:
      context: ./apps/backend
      target: development
    env_file:
      - path: .env
        required: false
    environment:
      # Runtime uses non-superuser app role so FORCE RLS applies.
      DATABASE_URL: postgresql+asyncpg://agent_saas_app:${POSTGRES_PASSWORD:-agent_saas_dev}@postgres:5432/${POSTGRES_DB:-agent_saas}
      AGNO_DATABASE_URL: postgresql+psycopg://agent_saas_app:${POSTGRES_PASSWORD:-agent_saas_dev}@postgres:5432/${POSTGRES_DB:-agent_saas}
      MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agent_saas}:${POSTGRES_PASSWORD:-agent_saas_dev}@postgres:5432/${POSTGRES_DB:-agent_saas}
      POSTGRES_APP_PASSWORD: ${POSTGRES_PASSWORD:-agent_saas_dev}
      AUTH_DISABLED: "false"
      AUTH_PROVIDER: oidc
      # Token iss is the browser-facing Keycloak URL; JWKS is fetched in-network.
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8080/realms/atlas}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://keycloak:8080/realms/atlas/protocol/openid-connect/certs}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-atlas-web}
      AUTH_ADMIN_SECRET: ${AUTH_ADMIN_SECRET:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-dev-only-change-me-please-32b}
      DOCUMENT_UPLOAD_DIR: /data/uploads
      # Force MinIO for compose; empty DOCUMENT_BUCKET= in host .env would otherwise win.
      DOCUMENT_BUCKET: atlas-documents
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      REDIS_URL: redis://:${REDIS_PASSWORD:-atlas-redis-dev}@redis:6379/0
      SANDBOX_INTERNAL_TOKEN: ${SANDBOX_INTERNAL_TOKEN:-dev-sandbox-internal-token-change-me}
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "10"
      CORS_ORIGINS: http://localhost:3000
      ENVIRONMENT: development
      EMAIL_INBOUND_DOMAIN: ${EMAIL_INBOUND_DOMAIN:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      SANDBOX_MANAGER_URL: http://sandbox-manager:8090
      SANDBOX_CALLBACK_BASE_URL: http://backend:7777
      SANDBOX_PYTHON_IMAGE: atlas-sandbox-python:local
    ports:
      - "7777:7777"
    volumes:
      - ./apps/backend:/app
      - document_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      sandbox-manager:
        condition: service_healthy
      keycloak:
        condition: service_started
    command: >
      sh -c "python -c 'import asyncio; from app.core.settings import get_settings; from app.db.roles import ensure_app_db_role; asyncio.run(ensure_app_db_role(get_settings()))' &&
      alembic upgrade head &&
      python -c 'import asyncio; from app.core.settings import get_settings; from app.db.roles import ensure_app_db_role; asyncio.run(ensure_app_db_role(get_settings()))' &&
      uvicorn app.main:app --host 0.0.0.0 --port 7777 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7777/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ./apps/web
      target: development
    env_file:
      - path: .env
        required: false
      - path: ./apps/web/.env.local
        required: false
    environment:
      NEXT_PUBLIC_AGENTOS_URL: http://localhost:7777
      AGENTOS_INTERNAL_URL: http://backend:7777
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-auth-secret-change-me-please}
      AUTH_KEYCLOAK_ID: atlas-web
      AUTH_KEYCLOAK_SECRET: atlas-web-dev-secret-change-me
      AUTH_KEYCLOAK_ISSUER: http://localhost:8080/realms/atlas
      NEXT_PUBLIC_AUTH_PROVIDER: keycloak
      NEXT_PUBLIC_DEV_AUTH: "false"
      NEXT_PUBLIC_DEV_TENANT_ID: "11111111-1111-1111-1111-111111111111"
      NEXT_PUBLIC_DEV_USER_ID: "dev-admin"
      NEXT_PUBLIC_DEV_ROLE: "tenant_admin"
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    command: sh -c "npm install --include=optional && npm run dev -- --hostname 0.0.0.0"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  document_uploads:
  minio_data:
  keycloak_data:
  web_node_modules:
  web_next:
