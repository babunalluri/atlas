[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-tenant-agent-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "agno>=2.0",
  "alembic>=1.13",
  "anthropic>=0.50",
  "asyncpg>=0.29",
  "boto3>=1.35",
  "croniter>=6.2.4",
  "cryptography>=43",
  "ddgs>=9.0",
  "fastapi>=0.115",
  "groq>=0.11",
  "httpx>=0.27",
  "jsonschema>=4.26.0",
  "mcp>=1.28.1",
  "openai>=1.50",
  "openinference-instrumentation-agno>=0.1",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "pgvector>=0.3",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.5",
  "pyjwt[crypto]>=2.9",
  "python-multipart>=0.0.12",
  "pytz>=2026.2",
  "pyyaml>=6.0.3",
  "sqlalchemy[asyncio]>=2.0",
  "structlog>=24",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "types-jsonschema>=4.26",
  "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.hatch.build.targets.wheel.sources]
"src/app" = "app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Preserve applied Alembic files verbatim even when their generated annotations
# use the older typing style.
"migrations/versions/*.py" = ["UP007", "UP035"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
exclude = ["migrations"]
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = [
  "app.agent_runtime.*",
  "app.auth.middleware",
  "app.tools.registry",
]
ignore_errors = true

[dependency-groups]
dev = [
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260518",
]
