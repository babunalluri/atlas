[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-tenant-agent-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "agno>=2.0",
  "agentql>=1.0",
  "alembic>=1.13",
  "anthropic>=0.50",
  "apify-client>=1.0",
  "arxiv>=2.0",
  "atlassian-python-api>=3.41",
  "asyncpg>=0.29",
  "baidusearch>=1.0",
  "beautifulsoup4>=4.12",
  "boto3>=1.35",
  "browserbase>=1.0",
  "cartesia>=1.0",
  "cel-python>=0.2",
  "croniter>=6.2.4",
  "cryptography>=43",
  "ddgs>=9.0",
  "elevenlabs>=1.0",
  "exa-py>=1.0",
  "fal-client>=0.5",
  "fastapi>=0.115",
  "firecrawl-py>=1.0",
  "google-genai>=1.0",
  "google-search-results>=2.4",
  "googlemaps>=4.10",
  "google-maps-places>=0.1",
  "groq>=0.11",
  "gunicorn>=22.0",
  "httpx>=0.27",
  "jira>=3.8",
  "jsonschema>=4.26.0",
  "linkup-sdk>=0.2",
  "lumaai>=0.1",
  "lxml_html_clean>=0.1",
  "mcp>=1.28.1",
  "newspaper4k>=0.9",
  "notion-client>=2.2",
  "openai>=1.50",
  "openinference-instrumentation-agno>=0.1",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "oxylabs>=1.0",
  "parallel-web>=0.1",
  "pgvector>=0.3",
  "plivo>=4.0",
  "praw>=7.7",
  "psycopg[binary]>=3.2",
  "pycountry>=24.0",
  "pydantic-settings>=2.5",
  "pygithub>=2.0",
  "pyjwt[crypto]>=2.9",
  "pypdf>=4.0",
  "python-gitlab>=4.0",
  "python-multipart>=0.0.12",
  "python-redmine>=2.3",
  "pyTelegramBotAPI>=4.14",
  "pytz>=2026.2",
  "pyyaml>=6.0.3",
  "redis[hiredis]>=5.0",
  "replicate>=0.25",
  "requests>=2.32",
  "resend>=2.0",
  "slack-sdk>=3.27",
  "sqlalchemy[asyncio]>=2.0",
  "structlog>=24",
  "tavily-python>=0.5",
  "todoist-api-python>=2.1",
  "trafilatura>=1.12",
  "tweepy>=4.14",
  "twelvelabs>=0.4",
  "twilio>=9.0",
  "uvicorn[standard]>=0.30",
  "valyu>=0.1",
  "webexpythonsdk>=2.0",
  "wikipedia>=1.4",
  "yfinance>=0.2",
  "youtube-transcript-api>=0.6",
  "ag-ui-protocol>=0.1.19",
  "a2a-sdk>=1.1.2",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20",
  "fakeredis[lua]>=2.23",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "types-jsonschema>=4.26",
  "types-pyyaml>=6.0",
  "types-redis>=4.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.hatch.build.targets.wheel.sources]
"src/app" = "app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Preserve applied Alembic files verbatim even when their generated annotations
# use the older typing style.
"migrations/versions/*.py" = ["UP007", "UP035"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
exclude = ["migrations"]
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = [
  "app.agent_runtime.*",
  "app.auth.middleware",
  "app.tools.registry",
]
ignore_errors = true

[dependency-groups]
dev = [
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260518",
]
